<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" id="theme-color" content="#f4f3f1">
<title>Salary Site — Hazem Nader</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="shortcut icon" href="favicon.ico">
<script>try{var th=JSON.parse(localStorage.getItem("pay.theme"))||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=th;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: the portfolio's language applied to a pay ledger. Hard 2px rules, no radius, heavy uppercase display,
   one giant ghost numeral for the month. Blue = earned, red = deducted, amber = leave. */
:root{
  --bg:#f4f3f1; --surface:#ffffff; --ink:#1c1a19; --muted:#6b6560; --muted-2:#8f8a83; --line:#dedbd6;
  --blue:#2f5fa8; --blue-deep:#22467d; --blue-lt:#4a7fd4; --amber:#a9702d; --red:#b23a3a;
  --blue-soft:rgba(47,95,168,.10); --amber-soft:rgba(169,112,45,.13); --red-soft:rgba(178,58,58,.10);
  --blue-shadow:rgba(47,95,168,.30); --ink-shadow:rgba(28,26,25,.10);
  --glow:rgba(47,95,168,.16); --glow-2:rgba(47,95,168,.05);
  --header:rgba(244,243,241,.92); --ghost:#ffffff; --ghost-shadow:rgba(28,26,25,.14);
  --on-accent:#ffffff; --scrim:rgba(15,14,13,.62); --hatch:rgba(28,26,25,.055); --hatch2:rgba(28,26,25,.2); --fri-bg:#e6e3de;
  --old:#9a8f7c; --d-half:#c2577f; --d-single:#b23a3a; --d-off:#7d3fa6; --d-abs:#5a1626; --l-official:#2f8a6b; --l-exam:#5f6b78;
  --latin:'Archivo',sans-serif; --arabic:'Noto Kufi Arabic','Archivo',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1b1918; --ink:#f1efec; --muted:#a8a199; --muted-2:#7f7972; --line:#35312d;
  --blue:#74a2ea; --blue-deep:#9cbdf3; --blue-lt:#9cbdf3; --amber:#d99e58; --red:#e5746f;
  --blue-soft:rgba(116,162,234,.14); --amber-soft:rgba(217,158,88,.15); --red-soft:rgba(229,116,111,.14);
  --blue-shadow:rgba(116,162,234,.22); --ink-shadow:rgba(0,0,0,.4);
  --glow:rgba(116,162,234,.13); --glow-2:rgba(116,162,234,.04);
  --header:rgba(18,17,16,.9); --ghost:#1d1b1a; --ghost-shadow:rgba(0,0,0,.5);
  --old:#7d7462; --d-half:#ea8fb0; --d-single:#e5746f; --d-off:#b98ae0; --d-abs:#ff4d6d; --l-official:#5cc4a0; --l-exam:#9aa7b5;
  --on-accent:#121110; --scrim:rgba(0,0,0,.72); --hatch:rgba(241,239,236,.05); --hatch2:rgba(241,239,236,.22); --fri-bg:#262321;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--latin);-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;font-size:15px}
:root[lang="ar"] body{font-family:var(--arabic)}
::selection{background:var(--blue);color:var(--on-accent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.n{font-family:var(--latin);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.lat{font-family:var(--latin);direction:ltr;unicode-bidi:isolate;display:inline-block}
.up{text-transform:uppercase}

/* chrome */
.scroll-progress{position:fixed;top:0;left:0;width:100%;height:3px;z-index:60;pointer-events:none}
.scroll-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--amber));transform:scaleX(0);transform-origin:0 50%}
.page-glow{position:fixed;left:0;top:0;width:900px;height:900px;opacity:0;background:radial-gradient(circle,var(--glow) 0%,var(--glow-2) 40%,transparent 68%);transition:transform .22s ease-out,opacity .5s ease;pointer-events:none;z-index:0}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:14px clamp(16px,4vw,48px);padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--header);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .mark{font-family:var(--latin);font-size:23px;font-weight:900;letter-spacing:-.03em;color:var(--blue)}
.brand .div{width:2px;height:20px;background:var(--line);flex:none}
.brand .name{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:root[lang="ar"] .brand .name{letter-spacing:0;font-size:12.5px}
nav{margin-inline-start:auto;display:flex;align-items:center;gap:22px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
:root[lang="ar"] nav{letter-spacing:0;font-size:13.5px}
nav button.tab{background:none;border:0;padding:6px 0;position:relative;white-space:nowrap;transition:color .2s,transform .2s}
nav button.tab::after{content:'';position:absolute;inset-inline:0;bottom:-2px;height:2px;background:linear-gradient(90deg,var(--blue),var(--amber));transform:scaleX(0);transform-origin:0 50%;transition:transform .5s var(--ease)}
:root[dir="rtl"] nav button.tab::after{transform-origin:100% 50%}
nav button.tab:hover{color:var(--blue);transform:translateY(-1px)}
nav button.tab[aria-selected="true"]{color:var(--blue)}
nav button.tab[aria-selected="true"]::after{transform:scaleX(1)}
.tools{display:flex;align-items:center;gap:8px}
.sq{width:36px;height:36px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-size:12px;font-weight:800;transition:border-color .2s,transform .2s,background .2s,color .2s}
.sq:hover{border-color:var(--ink);transform:translateY(-2px)}
.sq svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square}
.sync{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);white-space:nowrap}
:root[lang="ar"] .sync{letter-spacing:0;font-size:11.5px}
.sync i{width:8px;height:8px;background:var(--line)}
.sync.ok i{background:var(--blue)} .sync.busy i{background:var(--amber);animation:pulse .8s ease-in-out infinite} .sync.err i{background:var(--red)}
.tabbar{display:none}
@media(max-width:820px){
  nav{display:none}
  .tools{margin-inline-start:auto}
  .sync span{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;inset-inline:0;bottom:0;z-index:50;background:var(--header);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar button{background:none;border:0;padding:13px 4px 11px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);position:relative}
  :root[lang="ar"] .tabbar button{letter-spacing:0;font-size:12.5px}
  .tabbar button[aria-selected="true"]{color:var(--blue)}
  .tabbar button[aria-selected="true"]::before{content:'';position:absolute;top:-2px;inset-inline:18%;height:3px;background:linear-gradient(90deg,var(--blue),var(--amber))}
  main{padding-bottom:72px}
}

/* type system */
.eyebrow{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--blue)}
:root[lang="ar"] .eyebrow{letter-spacing:.02em;font-size:13px}
.eyebrow::before{content:'';width:32px;height:2px;background:var(--blue);flex:none}
.eyebrow.amber{color:var(--amber)} .eyebrow.amber::before{background:var(--amber)}
.eyebrow.red{color:var(--red)} .eyebrow.red::before{background:var(--red)}
.display{font-family:var(--latin);font-weight:900;text-transform:uppercase;letter-spacing:-.04em;line-height:.88}
:root[lang="ar"] .display{font-family:var(--arabic);font-weight:700;letter-spacing:0;line-height:1.15}
.rule-g{display:block;width:64px;height:4px;background:linear-gradient(90deg,var(--blue),var(--amber));transform-origin:0 50%}
:root[dir="rtl"] .rule-g{transform-origin:100% 50%}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,4vw,48px);position:relative;z-index:1}
.sub{color:var(--muted);line-height:1.75}

/* motion */
@keyframes riseIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes ghostIn{from{opacity:0;transform:scale(1.07)}to{opacity:1;transform:scale(1)}}
@keyframes ghostFloat{0%,100%{translate:0 0}50%{translate:0 -18px}}
@keyframes letterIn{from{opacity:0;transform:translateY(.5em) rotate(6deg)}to{opacity:1;transform:none}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(220%)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes stamp{0%{transform:scale(1.9) rotate(-14deg);opacity:0}60%{transform:scale(.94) rotate(-7deg);opacity:1}100%{transform:scale(1) rotate(-7deg);opacity:1}}
@keyframes cellIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes drawerIn{from{transform:translateX(var(--dx,60px));opacity:0}to{transform:none;opacity:1}}
.fresh .rv{animation:riseIn .9s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
.fresh .rule-g{animation:growX .9s var(--ease) .25s both}
.fresh .letter{display:inline-block;opacity:0;animation:letterIn .7s var(--ease) forwards}
.fresh .cell{animation:cellIn .5s var(--ease) both;animation-delay:calc(var(--c,0)*14ms + 250ms)}
.fresh .fill{animation:growX 1.1s var(--ease) .3s both}
.fresh .fill::after{animation:shimmer 1.1s ease-out 1s}

/* hero */
.stage{position:relative;overflow:hidden;border-bottom:2px solid var(--ink)}
.ghost{position:absolute;inset-inline-end:clamp(10px,7vw,120px);top:34px;font-family:var(--latin);font-size:clamp(170px,26vw,360px);line-height:.78;font-weight:900;letter-spacing:-.05em;color:var(--ghost);text-shadow:0 26px 60px var(--ghost-shadow);user-select:none;pointer-events:none;z-index:0;transition:color .5s ease,text-shadow .5s ease}
.fresh .ghost{animation:ghostIn 1.1s .1s var(--ease) both,ghostFloat 7s ease-in-out 1.2s infinite}
.ghost.lit{color:var(--blue-lt);text-shadow:0 0 60px var(--blue-shadow),0 0 140px var(--blue-shadow)}
@media(max-width:900px){.ghost{font-size:44vw;top:auto;bottom:-6vw;opacity:.55}}
.hero{position:relative;z-index:1;padding-block:clamp(34px,6vw,64px) clamp(30px,5vw,52px)}
.hero h1{margin-top:18px;font-size:clamp(46px,9vw,112px);cursor:default;transition:color .35s ease,text-shadow .45s ease}
.hero h1:hover{color:var(--blue);text-shadow:0 0 34px var(--blue-shadow)}
.hero h1 .yr{color:var(--muted-2);font-size:.42em;letter-spacing:-.02em;margin-inline-start:.25em;font-family:var(--latin)}
.month-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:22px}
.month-nav select{height:36px;background:var(--surface);border:2px solid var(--line);padding:0 10px;font-family:var(--latin);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.sq:disabled{opacity:.35;cursor:default;transform:none}
:root[dir="rtl"] .flip{transform:scaleX(-1)}
.total-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px 40px;margin-top:clamp(26px,4vw,44px)}
.total .lbl{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
:root[lang="ar"] .total .lbl{letter-spacing:0;font-size:13px}
.total .big{font-family:var(--latin);font-weight:900;letter-spacing:-.045em;line-height:.95;font-size:clamp(50px,11vw,124px);font-variant-numeric:tabular-nums;direction:ltr;display:flex;align-items:baseline;gap:.12em;flex-wrap:wrap}
.total .big .dec{font-size:.42em;color:var(--muted-2);letter-spacing:-.02em}
.total .big .cur{font-size:.16em;font-weight:800;letter-spacing:.2em;color:var(--blue);align-self:flex-start;margin-top:.9em}
.total .rule-g{margin-top:16px}
.total .note{margin-top:10px;font-size:12px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:2px solid var(--ink);margin-top:clamp(26px,4vw,40px)}
.fact{padding:16px 16px 10px 0;border-inline-end:2px solid var(--line);padding-inline:16px}
.fact:first-child{padding-inline-start:0}
.fact:last-child{border-inline-end:0}
.fact>span{display:block;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2)}
:root[lang="ar"] .fact>span{letter-spacing:0;font-size:12px}
.fact b{font-family:var(--latin);font-size:clamp(17px,2.2vw,22px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.fact em{display:block;font-style:normal;font-size:11px;color:var(--muted-2);margin-top:2px;line-height:1.5}
.fact .pen{font-style:normal;color:var(--blue);font-size:11px}
.fin{display:block;width:100%;min-width:0;background:transparent;border:0;border-bottom:2px dashed var(--line);padding:0 0 1px;font-family:var(--latin);font-size:clamp(17px,2.2vw,22px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;direction:ltr;text-align:start;color:var(--ink);-moz-appearance:textfield;transition:border-color .2s}
:root[dir="rtl"] .fin{text-align:end}
.fin::-webkit-outer-spin-button,.fin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fin:hover{border-bottom-color:var(--blue)}
.fin:focus{outline:none;border-bottom:2px solid var(--blue);color:var(--blue)}
.fact.ed{cursor:text;display:block}
.fact.old{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--hatch) 6px 8px)}
.fact.old>span{color:var(--muted-2)}
.fact.old b{color:var(--old);font-weight:600;font-style:italic;letter-spacing:0}
.bd-none{border:2px dashed var(--line);padding:14px;color:var(--muted-2);font-size:13px;text-align:center}
.fact b.plus{color:var(--blue)} .fact b.minus{color:var(--red)}
@media(max-width:620px){.facts{grid-template-columns:repeat(2,1fr)}.fact{border-bottom:2px solid var(--line);padding-block:12px}.fact:nth-child(odd){padding-inline-start:0}.fact:nth-child(even){border-inline-end:0}}

/* buttons */
.btn-solid,.btn-outline{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:15px 20px;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border:2px solid transparent;transition:transform .2s,translate .15s ease-out,box-shadow .2s,background .2s,color .2s}
:root[lang="ar"] .btn-solid,:root[lang="ar"] .btn-outline{letter-spacing:0;font-size:14px}
.btn-solid{background:var(--blue);color:var(--on-accent);box-shadow:0 12px 26px var(--blue-shadow)}
.btn-solid:hover{transform:translateY(-3px);box-shadow:0 16px 34px var(--blue-shadow)}
.btn-outline{background:var(--surface);border-color:var(--ink);color:var(--ink);box-shadow:0 8px 20px var(--ink-shadow)}
.btn-outline:hover{transform:translateY(-3px);background:var(--ink);color:var(--bg)}
.btn-sm{padding:9px 14px;font-size:11px;box-shadow:none}
.btn-red{background:var(--red);color:var(--on-accent);box-shadow:none}
button:disabled{opacity:.5;cursor:default}

/* period map */
.band{border-bottom:2px solid var(--line);padding-block:26px}
.band-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-bottom:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:root[lang="ar"] .legend{letter-spacing:0;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;margin-inline-end:6px;vertical-align:-1px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:10px 5px}
.mc{display:flex;flex-direction:column;gap:5px;min-width:0}
.mc .cell{width:100%}
.cd{font-size:9.5px;font-weight:700;text-align:center;color:var(--muted-2);white-space:nowrap;overflow:hidden;line-height:1.2;text-transform:uppercase;letter-spacing:.04em}
:root[lang="ar"] .cd{letter-spacing:0;font-size:10px;text-transform:none}
.mc.fri .cd{color:var(--ink);font-weight:800}
.mc.today .cd{color:var(--blue);font-weight:800}
.cell{aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);font-family:var(--latin);font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted-2);position:relative;transition:transform .2s var(--ease),border-color .2s,box-shadow .2s;padding:0}
.cell:hover{transform:translateY(-4px);border-color:var(--ink);box-shadow:0 8px 16px var(--ink-shadow);z-index:2}
.cell.fri{background:repeating-linear-gradient(135deg,var(--fri-bg) 0 4px,var(--hatch2) 4px 6px);border-color:var(--muted-2);color:var(--ink)}
.cell.f{background:var(--k);border-color:var(--k);color:var(--on-accent)}
.cell.f.both{background:linear-gradient(135deg,var(--blue) 0 50%,var(--k) 50% 100%);border-color:var(--ink)}
.cell.today{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--blue)}
@media(min-width:1000px){.map{grid-template-columns:repeat(var(--n,31),minmax(0,1fr))}.cell{aspect-ratio:4/5}}
.progress{height:4px;background:var(--line);margin-top:20px;overflow:hidden}
.fill{position:relative;display:block;height:100%;background:var(--blue);transform-origin:0 50%;overflow:hidden;transition:width .9s var(--ease)}
:root[dir="rtl"] .fill{transform-origin:100% 50%}
.fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%)}
.fill.red{background:var(--red)} .fill.amber{background:var(--amber)} .fill.grad{background:linear-gradient(90deg,var(--blue),var(--amber))}

/* body grid */
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border-bottom:2px solid var(--ink)}
.col{min-width:0;padding-block:34px 44px}
.col.main{padding-inline-end:clamp(16px,3vw,40px);border-inline-end:2px solid var(--line)}
.col.side{padding-inline-start:clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:38px}
@media(max-width:940px){.cols{grid-template-columns:minmax(0,1fr)}.col.main{padding-inline-end:0;border-inline-end:0;border-bottom:2px solid var(--line)}.col.side{padding-inline-start:0}}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-h .num{font-family:var(--latin);font-size:34px;font-weight:900;color:var(--blue);letter-spacing:-.02em;line-height:1}
.sec-h h3{font-size:22px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1}
:root[lang="ar"] .sec-h h3{letter-spacing:0;font-weight:700}
.sec-h .hint{margin-inline-start:auto;font-size:11.5px;color:var(--muted-2);text-align:end}
.sec-h.red .num{color:var(--red)} .sec-h.amber .num{color:var(--amber)}

/* ledger */
.ledger{width:100%;border-collapse:collapse}
.ledger th{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--on-accent);background:var(--blue);padding:9px 12px;text-align:start}
:root[lang="ar"] .ledger th{letter-spacing:0;font-size:12px}
.ledger td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.ledger tbody tr{cursor:pointer;transition:background .15s}
.ledger tbody tr:hover{background:var(--surface)}
.ledger tbody tr:hover .dn{color:var(--blue)}
.ledger tr.fri{background:repeating-linear-gradient(135deg,var(--fri-bg) 0 6px,var(--hatch2) 6px 8px)}
.ledger tr.fri .dn{color:var(--ink);font-weight:800}
.ledger tr.today td:first-child{box-shadow:inset 4px 0 0 var(--ink)}
:root[dir="rtl"] .ledger tr.today td:first-child{box-shadow:inset -4px 0 0 var(--ink)}
.dn{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:color .15s}

/* ===== محرك الحساب: نفس معادلات Template 2026 ===== */
const OVER_FIXED=["Over Time 4H","Over Time 6H","Over Time 8H","Friday","Double Paid","Over 4H D"];
const COMP=["Compensation A","Compensation D"];
const DED_CUT=["Absence","Day Off","Single Day","Half Day"];
const LEAVE=["Exam","Official holiday","Annual"];
function classify(raw){
  const s=String(raw==null?"":raw).trim(),l=s.toLowerCase();let x;
  if(!s)return {t:"none"};
  const f=OVER_FIXED.find(o=>o.toLowerCase()===l);
  if(f)return {t:"fixed",name:f};
  if(l.indexOf("compensation a")>=0){x=s.match(/\d+/);return {t:"compA",h:x?+x[0]:0};}
  if(l.indexOf("compensation d")>=0){x=s.match(/\d+/);return {t:"compD",h:x?+x[0]:0};}
  if((x=s.match(/^(\d+\.?\d*)\s*d/i)))return {t:"hD",h:+x[1]};
  if((x=s.match(/^(\d+\.?\d*)\s*o/i)))return {t:"hO",h:+x[1]};
  if(/^\d+\.?\d*$/.test(s))return {t:"hD",h:+s};
  if(l==="exam")return {t:"exam"};
  return {t:"other"};
}
function calcMonth(m){
  const c={friday:0,double:0,o4d:0,hoursD:0,ot4:0,ot6:0,ot8:0,hoursO:0,compA:0,compD:0,absence:0,dayoff:0,single:0,half:0,exam:0,official:0,annual:0};
  const fx={"Friday":"friday","Double Paid":"double","Over 4H D":"o4d","Over Time 4H":"ot4","Over Time 6H":"ot6","Over Time 8H":"ot8"};
  (m.rows||[]).forEach(d=>{
    const k=classify(d.over);
    if(k.t==="fixed")c[fx[k.name]]++;
    else if(k.t==="compA")c.compA+=k.h?k.h/8:1;
    else if(k.t==="compD")c.compD+=k.h?k.h/8:1;
    else if(k.t==="hD")c.hoursD+=k.h;
    else if(k.t==="hO")c.hoursO+=k.h;
    else if(k.t==="exam")c.exam++;
    const l=String(d.ded||"").trim().toLowerCase();
    if(l==="absence")c.absence++;else if(l==="day off")c.dayoff++;else if(l==="single day")c.single++;
    else if(l==="half day")c.half++;else if(l==="exam")c.exam++;else if(l==="official holiday")c.official++;else if(l==="annual")c.annual++;
  });
  const basic=+m.basic||0,kbi=+m.kbi||0,bonus=+m.bonus||0,rate=basic/26;
  const over=[
    {name:"Friday",n:c.friday,days:c.friday*2,per:2},{name:"Double Paid",n:c.double,days:c.double*2,per:2},
    {name:"Over 4H D",n:c.o4d,days:c.o4d,per:1},{name:"Over Per Hours D",n:c.hoursD,days:c.hoursD*2/8,per:0.25,h:1},
    {name:"Over Time 4H",n:c.ot4,days:c.ot4*0.75,per:0.75},{name:"Over Time 6H",n:c.ot6,days:c.ot6*1.125,per:1.125},
    {name:"Over Time 8H",n:c.ot8,days:c.ot8*1.5,per:1.5},{name:"Over Per Hours",n:c.hoursO,days:c.hoursO*1.5/8,per:0.1875,h:1}];
  over.forEach(o=>o.k="over");
  const aN=c.absence-c.compA,oN=c.dayoff-c.compD;
  const ded=[{name:"Absence",n:aN,days:aN*3,per:3,k:"abs"},{name:"Day Off",n:oN,days:oN*2,per:2,k:"off"},{name:"Single Day",n:c.single,days:c.single,per:1,k:"single"},{name:"Half Day",n:c.half,days:c.half*0.5,per:0.5,k:"half"}];
  over.forEach(o=>o.money=o.days*rate);ded.forEach(o=>o.money=o.days*rate);
  const overDays=over.reduce((a,o)=>a+o.days,0),dedDays=ded.reduce((a,o)=>a+o.days,0);
  const computed=basic+kbi+bonus+(overDays-dedDays)*rate;
  const sheet=typeof m.total==="number"?m.total:null;
  return {c,rate,over,ded,overDays,dedDays,overMoney:overDays*rate,dedMoney:dedDays*rate,gross:basic+kbi,bonus,computed,
    total:sheet==null?computed:sheet,differs:sheet!=null&&Math.abs(sheet-computed)>0.01};
}

  +(D.over?say(D.over,overInfo(dayOver())||overInfo(D.over),(overInfo(dayOver())||{}).d):"")
  +'<div class="hrs"><div class="field hbox"><label for="d-hd">'+t("hD")+' <span class="lat">×2</span></label><input class="inp" id="d-hd" type="number" inputmode="decimal" min="0" step="any" value="'+esc(D.hD)+'" placeholder="0"><em id="c-hd">'+hrsHint(D.hD,2)+'</em></div><div class="field hbox"><label for="d-ho">'+t("hO")+' <span class="lat">×1.5</span></label><input class="inp" id="d-ho" type="number" inputmode="decimal" min="0" step="any" value="'+esc(D.hO)+'" placeholder="0"><em id="c-ho">'+hrsHint(D.hO,1.5)+"</em></div></div></div>"
  +'<div class="grp"><h4>'+t("cut")+'</h4><p class="gh">'+t("cutW")+'</p><div class="tgls">'+DED_CUT.slice().reverse().map(x=>tg("ded",x,dedInfo(x),D.ded===x)).join("")+"</div>"+(DED_CUT.includes(D.ded)?say(D.ded,dedInfo(D.ded)):"")+"</div>"
  +'<div class="grp"><h4>'+t("free")+'</h4><div class="tgls">'+LEAVE.slice().reverse().map(x=>tg("ded",x,dedInfo(x),D.ded===x)).join("")+"</div>"+(LEAVE.includes(D.ded)?say(D.ded,dedInfo(D.ded)):"")+"</div>"
  +'<div class="impact"><span>'+t("impact")+'</span><b id="impact" class="'+(im>0?"blue":im<0?"red":"")+'">'+sgn(im)+"</b></div>"
  +'<div class="acts"><button class="btn-solid" data-day="save">'+t("save")+'</button><button class="btn-outline" data-day="clear">'+t("clear")+'</button><button class="btn-outline" data-day="cancel">'+t("cancel")+"</button></div></div>";
  $("#overlay").innerHTML=html;
}
function syncDay(){if(!D)return;const g=id=>{const el=document.getElementById(id);return el?el.value:null;};let v;
  if((v=g("d-hd"))!==null)D.hD=v;if((v=g("d-ho"))!==null)D.hO=v;if((v=g("d-ch"))!==null)D.ch=v;}
function saveDay(clear){
  syncDay();const m=monthBy(S.cur),d=m.rows.find(x=>x.r===D.r),over=clear?"":dayOver(),ded=clear?"":D.ded,sheet=m.name,row=D.r;
  closeDay();if(d.over===over&&d.ded===ded)return;
  d.over=over;d.ded=ded;m.total=null;render();
  write("setDay",{sheet,row,over,ded},j=>{const i=S.months.findIndex(x=>x.name===sheet);if(i>=0)S.months[i]=j.month;});
}

/* ===== نافذة التأكيد ===== */
let M=null;
function closeModal(revert){const m=M;M=null;$("#modal").hidden=true;$("#modal").innerHTML="";document.body.style.overflow=D?"hidden":"";if(revert&&m&&m.type==="field")render();}
function openModal(m){M=m;drawModal();$("#modal").hidden=false;document.body.style.overflow="hidden";const f=$("#modal [data-focus]");if(f)setTimeout(()=>{f.focus();if(f.select)f.select();},60);}
function drawModal(){
  const m=M;let eb="",ttl="",body="",acts="";
  const btn=(a,l,cls)=>'<button type="button" class="'+cls+'" data-m="'+a+'">'+l+"</button>";
  if(m.type==="debt"){
    eb=t(m.kind==="owed"?"tOwed":"tMine");
    if(m.del){ttl=t("del");body='<p class="mq">'+t("delQ")+'</p><div class="mbox k-single"><span>'+esc(m.name||t("noName"))+'</span><b class="kc">'+money(m.amount)+"</b></div>";
      acts=btn("del-yes",t("yesDel"),"btn-solid btn-red")+btn("del-no",t("back"),"btn-outline");}
    else{ttl=t(m.r?"edit":"addT");
      body='<div class="field"><label for="m-name">'+t(m.kind==="owed"?"nameOwed":"nameMine")+'</label><input class="inp txt" id="m-name" type="text" value="'+esc(m.name||"")+'"'+(m.r?"":" data-focus")+"></div>"
      +'<div class="hrs"><div class="field"><label for="m-val">'+t("newAmt")+'</label><input class="inp" id="m-val" type="number" inputmode="decimal" step="any" value="'+(m.amount===""||m.amount==null?"":m.amount)+'" placeholder="0"></div><div class="field"><label for="m-date">'+t("dDate")+'</label><input class="inp" id="m-date" type="date" value="'+esc(m.date||iso(new Date()))+'"></div></div>'
      +'<div class="field"><label for="m-note">'+t("dNote")+'</label><input class="inp txt" id="m-note" type="text" value="'+esc(m.note||"")+'"></div>'
      +(m.r?'<button type="button" class="tgl k-official mdone" data-m="toggle-done" aria-pressed="'+!!m.done+'"><span>'+t(m.done?"dDone":"markDone")+"</span><b>"+(m.done?"✓":"○")+"</b></button>":"")
      +(m.err?'<div class="err">'+m.err+"</div>":"");
      acts=btn("save",t("saveBtn"),"btn-solid")+btn("cancel",t("cancel"),"btn-outline")+(m.r?btn("del",t("del"),"btn-outline btn-del"):"");}
  }else if(m.type==="field"){
    eb=m.label;ttl=t("confirm");
    body='<p class="mq">'+t("saveQ")+'</p><div class="mdiff"><div><span>'+t("from")+'</span><b>'+money(m.old)+'</b></div><i class="flip">&rarr;</i><div><span>'+t("to")+'</span><b class="blue">'+money(m.val)+"</b></div></div>";
    acts=btn("save",t("saveBtn"),"btn-solid")+btn("cancel",t("cancel"),"btn-outline");
  }else if(m.type==="newMonth"){
    eb=t("month");ttl=t("newMonth");
    const st=nmState(m);
    body='<p class="mq">'+t("newQ")+'</p><div class="hrs"><div class="field"><label for="m-mon">'+t("pickMon")+'</label><select class="inp" id="m-mon">'+MN[S.lang].map((n,i)=>'<option value="'+(i+1)+'"'+(i+1===m.mo?" selected":"")+">"+pad(i+1)+" · "+n+"</option>").join("")+'</select></div><div class="field"><label for="m-yr">'+t("pickYr")+'</label><input class="inp" id="m-yr" type="number" inputmode="numeric" min="2000" max="2100" step="1" value="'+m.y+'"></div></div><div id="nm-info" style="display:flex;flex-direction:column;gap:14px">'+st.html+"</div>";
    acts='<button type="button" class="btn-solid" id="nm-go" data-m="save"'+(st.ok?"":" disabled")+">"+t("create")+"</button>"+btn("cancel",t("cancel"),"btn-outline");
  }
  $("#modal").innerHTML='<div class="pop" role="dialog" aria-modal="true"><button type="button" class="pop-x" data-m="cancel" aria-label="close">×</button><div class="eyebrow">'+eb+'</div><h3 class="display">'+ttl+'</h3><span class="rule-g" style="animation:growX .7s var(--ease) both"></span><div class="pop-body">'+body+'</div><div class="pop-acts">'+acts+"</div></div>";
}
function nmState(m){const okY=m.y>=2000&&m.y<=2100,ex=okY&&!!monthBy(m.y+"-"+pad(m.mo));
  return {ok:okY&&!ex,html:(okY?'<div class="mbox k-over"><span>'+t("period")+'</span><b style="font-size:16px">'+dmy(iso(new Date(m.y,m.mo-2,26)))+" — "+dmy(iso(new Date(m.y,m.mo-1,25)))+"</b></div>":"")+(ex?'<div class="err">'+t("exists")+"</div>":(!okY?'<div class="err">'+t("badYr")+"</div>":""))};}
function nmSync(){if(!M||M.type!=="newMonth")return;M.mo=+$("#m-mon").value;M.y=+$("#m-yr").value||0;const st=nmState(M);$("#nm-info").innerHTML=st.html;$("#nm-go").disabled=!st.ok;}
function modalAct(a){
  const m=M;if(!m)return;
  if(a==="cancel"){closeModal(true);return;}
  if(m.type==="debt"){
    const grab=()=>{const g=id=>{const el=document.getElementById(id);return el?el.value:null;};let v;
      if((v=g("m-name"))!==null)m.name=v.trim();if((v=g("m-val"))!==null)m.amount=v;if((v=g("m-date"))!==null)m.date=v;if((v=g("m-note"))!==null)m.note=v.trim();};
    if(a==="toggle-done"){grab();m.done=!m.done;m.err="";drawModal();return;}
    if(a==="del"){grab();m.del=true;drawModal();return;}
    if(a==="del-no"){m.del=false;drawModal();return;}
    if(a==="del-yes"){closeModal();write("delDebt",{row:m.r},j=>{S.debts=j.debts;});return;}
    grab();
    if(m.amount===""||m.amount==null||!(+m.amount)){m.err=t("needAmt");drawModal();$("#m-val").focus();return;}
    closeModal();write("setDebt",{row:m.r||0,type:m.kind,name:m.name,amount:+m.amount,date:m.date,note:m.note,done:!!m.done},j=>{S.debts=j.debts;});return;
  }
  if(m.type==="field"){const mo=monthBy(S.cur),sheet=mo.name;closeModal();mo[m.f]=m.val;mo.total=null;render();
    write("setField",{sheet,field:m.f,value:m.val},j=>{const i=S.months.findIndex(x=>x.name===sheet);if(i>=0)S.months[i]=j.month;});return;}
  if(m.type==="newMonth"){nmSync();const key=m.y+"-"+pad(m.mo);if(monthBy(key)||!(m.y>=2000&&m.y<=2100))return;closeModal();S.busy=true;render();
    write("newMonth",{year:m.y,month:m.mo},j=>{S.cur=null;applyAll(j);if(monthBy(key))S.cur=key;S.busy=false;const nm=monthBy(key);toast(t("made")(nm?nm.name:""));}).then(()=>{S.busy=false;render();});}
}
/* ===== الثيم ===== */
function applyTheme(th){document.documentElement.dataset.theme=th;const b=$("#btn-theme");if(b)b.innerHTML=th==="dark"?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>':'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
  const meta=$("#theme-color");if(meta)meta.content=th==="dark"?"#121110":"#f4f3f1";}
function toggleTheme(ev){
  const next=document.documentElement.dataset.theme==="dark"?"light":"dark";store.set("pay.theme",next);
  if(!document.startViewTransition||reduce){applyTheme(next);return;}
  const x=ev.clientX||innerWidth-40,y=ev.clientY||30,rad=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(()=>applyTheme(next)).ready.then(()=>{
    document.documentElement.animate({clipPath:["circle(0px at "+x+"px "+y+"px)","circle("+rad+"px at "+x+"px "+y+"px)"]},{duration:650,easing:"cubic-bezier(.16,1,.3,1)",pseudoElement:"::view-transition-new(root)"});});
}

/* ===== الأحداث ===== */
function go(tab){S.tab=tab;try{history.replaceState(null,"","#"+tab);}catch(e){}render();window.scrollTo(0,0);}
function stepMonth(n){const i=S.months.indexOf(monthBy(S.cur));if(i+n>=0&&i+n<S.months.length){S.cur=S.months[i+n].key;render();}}
document.addEventListener("submit",ev=>{
  if(ev.target.id!=="login-form")return;ev.preventDefault();
  const url=API_URL||($("#in-url")?$("#in-url").value.trim():""),name=$("#in-user").value.trim(),pass=$("#in-pass").value;
  if(!name||!pass){S.err=errText("need");render();return;}
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){S.err=errText("url");render();return;}
  S.err="";S.busy=true;render();$("#in-user").value=name;
  call("login",{name,pass},{url,token:""}).then(j=>{S.ses={url,token:j.token,user:j.user};store.set("pay.ses",S.ses);return j.data&&j.data.months?j.data:call("all");})
    .then(j=>{applyAll(j);S.ready=true;S.busy=false;saveCache();setSync("ok");render();},e=>{S.ses=null;store.set("pay.ses",null);S.err=errText(e&&e.code);S.busy=false;render();const u=$("#in-user");if(u)u.value=name;});
});
document.addEventListener("click",ev=>{
  const el0=ev.target;let el;
  if((el=el0.closest("[data-tab]"))){go(el.dataset.tab);return;}
  if((el=el0.closest("#pw-eye"))){const f=$("#in-pass"),show=f.type==="password";f.type=show?"text":"password";el.setAttribute("aria-pressed",show);f.focus();return;}
  if(el0.closest("#btn-theme")){toggleTheme(ev);return;}
  if(el0.closest("#btn-lang")){S.lang=S.lang==="ar"?"en":"ar";store.set("pay.lang",S.lang);render();if(D)drawDay();if(M)drawModal();return;}
  if(el0.closest("#btn-out")){signOut();return;}
  if(el0.closest("#btn-refresh")){loadAll();return;}
  if($("#modal").contains(el0)){if(el0===$("#modal")){closeModal(true);return;}if((el=el0.closest("[data-m]")))modalAct(el.dataset.m);return;}
  if($("#overlay").contains(el0)){
    if(el0===$("#overlay")){closeDay();return;}
    if((el=el0.closest("[data-tg]"))){syncDay();const g=el.dataset.tg,n=el.dataset.name;
      if(g==="over"){D.over=D.over===n?"":n;D.hD="";D.hO="";D.other="";if(!COMP.includes(D.over))D.ch="";}
      else if(g==="other")D.other="";else D.ded=D.ded===n?"":n;
      drawDay();return;}
    if((el=el0.closest("[data-day]"))){const a=el.dataset.day;if(a==="cancel")closeDay();else saveDay(a==="clear");}
    return;
  }
  if((el=el0.closest("[data-row]"))){openDay(+el.dataset.row);return;}
  if((el=el0.closest("[data-goto]"))){S.cur=el.dataset.goto;go("month");return;}
  if((el=el0.closest("[data-act]"))){const a=el.dataset.act;
    if(a==="prev")stepMonth(-1);else if(a==="next")stepMonth(1);
    else if(a==="demo"){buildDemo();S.demo=true;S.err="";applyAll({months:DEMO.months,debts:DEMO.debts});S.ready=true;render();}
    else if(a==="new-month"){let y,mo;if(S.months.length){const l=S.months[S.months.length-1];y=yearOf(l);mo=monOf(l)+1;if(mo>12){mo=1;y++;}}else{const k=currentKey();y=+k.slice(0,4);mo=+k.slice(5,7);}
      openModal({type:"newMonth",y,mo});}
    return;}
  if((el=el0.closest("[data-addled]"))){openModal({type:"debt",kind:el.dataset.addled,r:0,name:"",amount:"",date:iso(new Date()),note:"",done:false});return;}
  if((el=el0.closest("[data-edit]"))){const x=S.debts.items.find(y=>y.r===+el.dataset.edit);if(x)openModal({type:"debt",kind:x.type,r:x.r,name:x.name,amount:x.amount==null?"":x.amount,date:x.date,note:x.note,done:x.done});return;}
});
document.addEventListener("keydown",ev=>{
  if(M){if(ev.key==="Escape")closeModal(true);else if(ev.key==="Enter"&&!ev.target.closest("button")){ev.preventDefault();if(ev.target.id==="m-name"){$("#m-val").focus();}else modalAct(M.del?"del-yes":"save");}return;}
  if(ev.key==="Escape"&&D){closeDay();return;}
  const tg=ev.target,typing=tg.matches&&tg.matches("input,select,textarea");
  if((ev.key==="Enter"||ev.key===" ")&&tg.matches&&tg.matches("tr[data-row]")){ev.preventDefault();openDay(+tg.dataset.row);return;}
  if(ev.key==="Enter"&&tg.dataset&&tg.dataset.mf){tg.blur();return;}
  if(!typing&&!D&&S.ready&&S.tab==="month"&&(ev.key==="ArrowLeft"||ev.key==="ArrowRight")){const rtl=S.lang==="ar";stepMonth((ev.key==="ArrowRight")!==rtl?1:-1);}
});
document.addEventListener("input",ev=>{if(M&&M.type==="newMonth"&&(ev.target.id==="m-yr"||ev.target.id==="m-mon")){nmSync();return;}
  if(!D)return;const id=ev.target.id;
  if(id==="d-hd"||id==="d-ho"){syncDay();if(+ev.target.value>0&&(D.over||D.other||(id==="d-hd"?+D.hO>0:+D.hD>0))){D.over="";D.other="";D.ch="";if(id==="d-hd")D.hO="";else D.hD="";drawDay();const f=document.getElementById(id);f.focus();const v=f.value;f.value="";f.value=v;return;}}
  if(id==="d-hd"||id==="d-ho"||id==="d-ch"){syncDay();const im=impactNow(),b=$("#impact");b.textContent=sgn(im);b.className=im>0?"blue":im<0?"red":"";const a=$("#c-hd"),o=$("#c-ho");if(a)a.textContent=hrsHint(D.hD,2);if(o)o.textContent=hrsHint(D.hO,1.5);}});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(M&&M.type==="newMonth"&&(el.id==="m-mon"||el.id==="m-yr")){nmSync();return;}
  if(el.id==="month-pick"){S.cur=el.value;render();return;}
  if(el.id==="y-leave"){S.yA=+el.value;render();return;}
  if(el.id==="y-year"){S.yY=+el.value;render();return;}
  if(el.dataset.mf){const m=monthBy(S.cur),f=el.dataset.mf,val=+el.value||0,old=+m[f]||0;if(old===val)return;
    openModal({type:"field",f,old,val,label:f==="basic"?t("basicLbl"):f==="kbi"?"KBI":t("bonus")});return;}
});
/* حركات المؤشر زي البورتفوليو */
(function(){
  const bar=$("#scrollBar");let tick=false;
  if(bar&&!reduce)window.addEventListener("scroll",()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{const d=document.documentElement,mx=d.scrollHeight-d.clientHeight;bar.style.transform="scaleX("+(mx>0?Math.min(1,d.scrollTop/mx):0).toFixed(4)+")";tick=false;});},{passive:true});
  if(!hover||reduce)return;
  const glow=$("#pageGlow");let mag=null;
  window.addEventListener("mousemove",e=>{
    glow.style.transform="translate("+Math.round(e.clientX-450)+"px,"+Math.round(e.clientY-450)+"px)";glow.style.opacity="1";
    const gh=document.querySelector(".ghost");if(gh){const r=gh.getBoundingClientRect();gh.classList.toggle("lit",Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))<Math.max(r.width,r.height)*0.55);}
    const b=e.target.closest&&e.target.closest(".mag");
    if(mag&&mag!==b){mag.style.translate="0 0";mag=null;}
    if(b){const r=b.getBoundingClientRect();b.style.translate=((e.clientX-r.left-r.width/2)*0.16).toFixed(1)+"px "+((e.clientY-r.top-r.height/2)*0.28).toFixed(1)+"px";mag=b;}
  });
  document.addEventListener("mouseleave",()=>{glow.style.opacity="0";});
})();
(function(){
  const h=(location.hash||"").slice(1);if(["month","leave","year","debts"].includes(h))S.tab=h;
  const mq=window.matchMedia("(prefers-color-scheme: dark)");
  applyTheme(store.get("pay.theme")||(mq.matches?"dark":"light"));
  mq.addEventListener&&mq.addEventListener("change",e=>{if(!store.get("pay.theme"))applyTheme(e.matches?"dark":"light");});
  if(S.ses&&API_URL)S.ses.url=API_URL;
  if(S.ses){const c=store.get("pay.cache");if(c&&c.months){applyAll(c);S.ready=true;}}
  render();if(S.ses)loadAll(true);
})();
</script>
</body>
